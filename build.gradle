buildscript {
    dependencies {
        classpath 'com.github.dexman545:Outlet:1.6.1'
    }
}
plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.+'
    id 'org.ajoberstar.reckon' version '0.13.1'
}
apply plugin: 'io.github.dexman545.outlet'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

group = project.group
description = project.displayname

base {
    archivesName = project.name
}

loom {
    accessWidenerPath = file('src/main/resources/minelp.aw')
}

reckon {
    scopeFromProp()
    stageFromProp('beta', 'rc', 'final')
}

outlet {
    allowSnapshotsForProject = true
    mcVersionRange = project.minecraft_version_range
}

System.out.println "Outlet MC Versions: ${outlet.mcVersions()}"

repositories {
    mavenLocal()
    flatDir { dirs 'lib' }
    maven { name 'Iris Deps'; url "https://maven.covers1624.net/" }
    maven { name 'Modrinth'; url 'https://api.modrinth.com/maven' }
    maven { name 'modmenu'; url 'https://maven.terraformersmc.com/releases' }
    maven { name 'minelp'; url 'https://repo.minelittlepony-mod.com/maven/snapshot' }
    maven { name 'minelp-release'; url 'https://repo.minelittlepony-mod.com/maven/release' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    api "net.fabricmc:fabric-loader:${project.loader_version}"

    //implementation "com.ptsmods:devlogin:3.4.1"

    api fabricApi.module("fabric-api-base", project.fabric_version)
    api fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version)
    api fabricApi.module("fabric-resource-loader-v0", project.fabric_version)
    api fabricApi.module("fabric-key-mapping-api-v1", project.fabric_version)
    api fabricApi.module("fabric-networking-api-v1", project.fabric_version)
    api fabricApi.module("fabric-rendering-v1", project.fabric_version)
    api fabricApi.module("fabric-transitive-access-wideners-v1", project.fabric_version)

    api "com.minelittlepony:kirin:${project.kirin_version}", { exclude group: "net.fabricmc.fabric-api" }
    include "com.minelittlepony:kirin:${project.kirin_version}"

    api "com.minelittlepony:mson:${project.mson_version}", { exclude group: "net.fabricmc.fabric-api" }
    include "com.minelittlepony:mson:${project.mson_version}"

    implementation "com.minelittlepony:hdskins:${project.hd_skins_version}", { exclude group: "net.fabricmc.fabric-api" }
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}", { exclude group: "net.fabricmc.fabric-api" }
    api fabricApi.module("fabric-screen-api-v1", project.fabric_version)

    if (project.use_sodium == '1') {
        api fabricApi.module("fabric-renderer-api-v1", project.fabric_version)
        api fabricApi.module("fabric-block-view-api-v2", project.fabric_version)
        api fabricApi.module("fabric-rendering-fluids-v1", project.fabric_version)
        compileOnly "maven.modrinth:sodium:${project.sodium_version}-fabric"
    }

    if (project.use_sodium == '1' && project.use_iris == '1') {
        compileOnly "maven.modrinth:iris:${project.iris_version}-fabric"
        implementation "org.anarres:jcpp:${project.iris_jcpp_version}"
        implementation "org.antlr:antlr4-runtime:${project.iris_antlr_version}"
        implementation "io.github.douira:glsl-transformer:${project.iris_glsl_version}"
    } else {
        compileOnly "maven.modrinth:iris-dummy:${project.iris_version}-fabric"
    }
}

//
// Imports the Background Ponies from the MLP Community Skin Pack
//
task copyBGPones(type: Copy) {

    def illegals = /[^a-z0-9_\/.-]/

    from "skins/Background Ponies"
    into temporaryDir

    eachFile {
        if (it.name =~ illegals) {
            logger.warn("Sanitizing file with illegal characters: ${it.path}")
            it.name = it.name.replaceAll(/\s/, '_').replaceAll(illegals, '')
        }
    }
}
processResources {
    inputs.property "version", project.version.toString()

    filesMatching("fabric.mod.json") {
        expand "version": project.version.toString(),
                "minecraftVersion": project.minecraft_version_range,
                "loaderVersion": ">=${project.loader_version}",
                "fabricVersion": ">=${project.fabric_version}",
                "kirinVersion": ">=${project.kirin_version}",
                "msonVersion": ">=${project.mson_version}"
    }

    from 'LICENSE'

    exclude "/assets/minelittlepony/textures/entity/pony"
    from(copyBGPones) {
        into "/assets/minelittlepony/textures/entity/pony"
    }
}

task apiJar(type: Jar) {
  archiveClassifier = 'api'
  dependsOn jar
  from zipTree(jar.archiveFile)
  include 'fabric.mod.json'
  include 'minelp_logo.png'
  include 'minelp.aw'
  include 'minelp.mixin.json'
  include 'com/minelittlepony/api/**'
  include 'com/minelittlepony/util/**'
}

tasks.named("build").configure {
  dependsOn(apiJar)
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

tasks.modrinth {
    onlyIf {
      def stage = version.version.stage.value
      stage == null || stage.name != 'beta'
    }
}

modrinth {
    token = System.env.MODRINTH_KEY
    projectId = project.modrinth_project_id
    //featured = true
    versionNumber = version.toString()
    versionName = project.name + '-' + version
    changelog = "[Changelog](https://github.com/MineLittlePony/MineLittlePony/releases/tag/${version.toString()})"
    loaders = ['fabric', 'quilt']
    uploadFile = jar
    outlet.mcVersions().each{ver ->
      gameVersions.add ver
    }
    dependencies {
       required.project 'P7dR8mSH' // Fabric API
       embedded.project '9aNz8Zqn' // Kirin
       optional.project 'FzE9gshV' // HD Skins
       optional.project 'h9pJxJR9' // Big Pony
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            artifact(apiJar) {
                builtBy apiJar
                classifier 'api'
            }

            pom {
                name = "MineLittlePony"
                description = "Ponify your Minecraft experience!"
                url = "https://minelittlepony-mod.com"
                licenses {
                    license {
                        name = "MIT Public License"
                        url = "https://tlo.mit.edu/learn-about-intellectual-property/software-and-open-source-licensing"
                    }
                }
                developers {
                    developer {
                        id = "killjoy1221"
                        name = "Matthew Messinger"
                        email = "mattmess1221@gmail.com"
                    }
                    developer {
                        id = "sollace"
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/MineLittlePony/MineLittlePony.git'
                    developerConnection = 'scm:git:ssh://github.com/MineLittlePony/MineLittlePony.git'
                    url = 'https://github.com/MineLittlePony/MineLittlePony'
                }
            }
        }
    }

    repositories {
        maven {
            name = "MineLittlePony"
            def stage = version.version.stage.value
            url = "s3://repo.minelittlepony-mod.com/maven/${stage != null && stage.name == 'beta' ? 'snapshot' : 'release'}"
            credentials(AwsCredentials) {
                accessKey = System.env.ACCESS_KEY
                secretKey = System.env.SECRET_KEY
            }
        }
    }
}
